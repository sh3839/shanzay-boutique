<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shanzay Boutique</title>
<link rel="icon" type="image/png" href="/Images/logo.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #fff8f5;
    color: #333;
}

header {
    background: white;
    padding: 15px 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo-img {
    width: 100px;
    height: 70px;
    object-fit: contain;
    display: block;
    margin: 0 auto 5px;
}

.brand-name {
    font-size: 28px;
    font-weight: bold;
    color: #9b4d68;
}

.hero {
    text-align: center;
    padding: 35px 20px;
    background: #fcecef;
}

.hero img {
    width: 130px;
    height: 90px;
    object-fit: contain;
    margin-bottom: 10px;
}

.hero h1 {
    color: #9b4d68;
    font-size: 34px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 17px;
    color: #666;
}

.controls {
    max-width: 1100px;
    margin: 25px auto;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.controls input,
.controls select {
    padding: 12px 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    background: white;
}

.controls input {
    width: 280px;
}

.collection-title {
    text-align: center;
    color: #9b4d68;
    font-size: 28px;
    margin: 25px 0;
}

#products {
    max-width: 1100px;
    margin: auto;
    padding: 0 20px 40px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
}

.product-card {
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    transition: transform 0.2s;
}

.product-card:hover {
    transform: translateY(-4px);
}

.product-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
    display: block;
}

.product-info {
    padding: 16px;
}

.product-info h3 {
    color: #9b4d68;
    font-size: 20px;
    margin-bottom: 8px;
}

.price {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.description {
    color: #666;
    font-size: 14px;
    line-height: 1.5;
    min-height: 42px;
}

.order-btn {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #9b4d68;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.order-btn:hover {
    background: #7f3d55;
}

.no-products {
    text-align: center;
    grid-column: 1 / -1;
    padding: 40px;
    color: #777;
}

footer {
    background: #9b4d68;
    color: white;
    text-align: center;
    padding: 25px 15px;
    margin-top: 30px;
}

footer p {
    margin: 5px 0;
}

/* ORDER MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 450px;
    border-radius: 14px;
    padding: 25px;
    position: relative;
}

.modal-box h2 {
    color: #9b4d68;
    margin-bottom: 20px;
}

.close-btn {
    position: absolute;
    right: 15px;
    top: 10px;
    font-size: 28px;
    cursor: pointer;
    color: #777;
}

.modal-box input,
.modal-box textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

.modal-box textarea {
    height: 90px;
    resize: vertical;
}

.whatsapp-btn {
    width: 100%;
    padding: 13px;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

@media (max-width: 600px) {
    .brand-name {
        font-size: 24px;
    }

    .hero h1 {
        font-size: 27px;
    }

    .controls {
        flex-direction: column;
    }

    .controls input,
    .controls select {
        width: 100%;
    }

    #products {
        grid-template-columns: 1fr;
    }

    .product-card img {
        height: 320px;
    }
}
</style>
</head>

<body>

<header>
    <img src="/Images/logo.png" alt="Shanzay Boutique Logo" class="logo-img">
    <div class="brand-name">Shanzay Boutique</div>
</header>

<section class="hero">
    <img src="/Images/logo.png" alt="Shanzay Boutique Logo">
    <h1>Shanzay Boutique</h1>
    <p>Beautiful Fashion • Elegant Style • Premium Collection</p>
</section>

<div class="controls">
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
        oninput="filterProducts()"
    >

    <select id="categoryFilter" onchange="filterProducts()">
        <option value="">All Categories</option>
        <option value="dress">Dresses</option>
        <option value="suit">Suits</option>
        <option value="lawn">Lawn</option>
        <option value="bridal">Bridal</option>
        <option value="casual">Casual</option>
    </select>
</div>

<h2 class="collection-title">Our Collection</h2>

<div id="products">
    <div class="no-products">Loading products...</div>
</div>

<div class="modal" id="orderModal">
    <div class="modal-box">
        <span class="close-btn" onclick="closeOrderModal()">&times;</span>

        <h2>Place Your Order</h2>

        <input type="text" id="customerName" placeholder="Your Name">

        <input type="text" id="customerPhone" placeholder="Your Phone Number">

        <textarea id="customerAddress" placeholder="Your Address"></textarea>

        <button class="whatsapp-btn" onclick="sendWhatsAppOrder()">
            Order on WhatsApp
        </button>
    </div>
</div>

<footer>
    <p>© 2026 Shanzay Boutique</p>
    <p>Beautiful Fashion • Elegant Style</p>
</footer>

<script>

let allProducts = [];
let selectedProduct = null;

const WHATSAPP_NUMBER = "923167860408";

async function loadProducts() {
    try {
        const response = await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Failed to load products");
        }

        allProducts = await response.json();

        displayProducts(allProducts);

    } catch (error) {
        console.error(error);

        document.getElementById("products").innerHTML = `
            <div class="no-products">
                Products could not be loaded.
            </div>
        `;
    }
}

function displayProducts(products) {

    const container = document.getElementById("products");

    if (!products || products.length === 0) {
        container.innerHTML = `
            <div class="no-products">
                No products available right now.
            </div>
        `;
        return;
    }

    container.innerHTML = products.map(product => {

        const image = product.image
            ? product.image
            : "/Images/logo.png";

        return `
            <div class="product-card">

                <img
                    src="${image}"
                    alt="${escapeHtml(product.name || "Product")}"
                    onerror="this.src='/Images/logo.png'"
                >

                <div class="product-info">

                    <h3>
                        ${escapeHtml(product.name || "Product")}
                    </h3>

                    <div class="price">
                        Rs. ${escapeHtml(product.price || "0")}
                    </div>

                    <div class="description">
                        ${escapeHtml(
                            product.description ||
                            "Beautiful collection by Shanzay Boutique"
                        )}
                    </div>

                    <button
                        class="order-btn"
                        onclick='openOrderModal(${JSON.stringify(product).replace(/'/g, "&#39;")})'
                    >
                        Order Now
                    </button>

                </div>
            </div>
        `;

    }).join("");
}

function filterProducts() {

    const search =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();

    const category =
        document.getElementById("categoryFilter").value
        .toLowerCase();

    const filtered = allProducts.filter(product => {

        const name =
            String(product.name || "").toLowerCase();

        const description =
            String(product.description || "").toLowerCase();

        const matchesSearch =
            !search ||
            name.includes(search) ||
            description.includes(search);

        const matchesCategory =
            !category ||
            name.includes(category) ||
            description.includes(category);

        return matchesSearch && matchesCategory;
    });

    displayProducts(filtered);
}

function openOrderModal(product) {

    selectedProduct = product;

    document.getElementById("orderModal").style.display = "flex";
}

function closeOrderModal() {

    document.getElementById("orderModal").style.display = "none";
}

function sendWhatsAppOrder() {

    if (!selectedProduct) {
        return;
    }

    const name =
        document.getElementById("customerName").value.trim();

    const phone =
        document.getElementById("customerPhone").value.trim();

    const address =
        document.getElementById("customerAddress").value.trim();

    if (!name || !phone || !address) {
        alert("Please fill all details.");
        return;
    }

    const message =
        `Assalam o Alaikum Shanzay Boutique,%0A%0A` +
        `I want to order:%0A` +
        `Product: ${selectedProduct.name || ""}%0A` +
        `Price: Rs. ${selectedProduct.price || ""}%0A%0A` +
        `Customer Name: ${name}%0A` +
        `Phone: ${phone}%0A` +
        `Address: ${address}`;

    const whatsappUrl =
        `https://wa.me/${WHATSAPP_NUMBER}?text=${message}`;

    window.open(whatsappUrl, "_blank");

    closeOrderModal();
}

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

window.onclick = function(event) {

    const modal =
        document.getElementById("orderModal");

    if (event.target === modal) {
        closeOrderModal();
    }
};

loadProducts();

</script>

</body>
</html>
