<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shanzay Boutique - Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8f5;
    color: #333;
}

header {
    background: #8d4f59;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
}

.home {
    background: white;
    color: #8d4f59;
    padding: 10px 18px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 30px auto;
}

/* DASHBOARD */

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    text-align: center;
}

.stat h3 {
    margin: 0 0 8px;
    color: #777;
    font-size: 14px;
}

.stat-number {
    font-size: 28px;
    font-weight: bold;
    color: #8d4f59;
}

/* BOX */

.box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

h2 {
    color: #8d4f59;
    margin-top: 0;
}

/* FORM */

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.checks {
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}

.checks label {
    display: flex;
    align-items: center;
    gap: 6px;
}

.checks input {
    width: auto;
    margin: 0;
}

.main-btn {
    width: 100%;
    padding: 14px;
    background: #8d4f59;
    color: white;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

.main-btn:hover {
    background: #713d46;
}

.main-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.cancel {
    margin-top: 8px;
    background: #777;
    display: none;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

/* SEARCH */

.tools {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.tools input,
.tools select {
    margin: 0;
}

/* PRODUCTS */

.product {
    display: flex;
    gap: 20px;
    padding: 18px;
    margin-bottom: 15px;
    border: 1px solid #eee;
    border-radius: 10px;
}

.product img {
    width: 130px;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    background: #eee;
}

.info {
    flex: 1;
}

.info h3 {
    margin-top: 0;
    margin-bottom: 8px;
}

.price {
    color: #8d4f59;
    font-weight: bold;
    font-size: 18px;
}

.old {
    color: #999;
    text-decoration: line-through;
    margin-left: 8px;
}

.badge {
    display: inline-block;
    background: #8d4f59;
    color: white;
    padding: 5px 9px;
    border-radius: 15px;
    font-size: 11px;
    margin: 3px;
}

.edit {
    background: #333;
    color: white;
}

.delete {
    background: #b00020;
    color: white;
}

button {
    border: 0;
    padding: 10px 15px;
    border-radius: 6px;
    cursor: pointer;
    margin-right: 5px;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

.count {
    color: #777;
    font-size: 14px;
    margin-bottom: 15px;
}

/* MOBILE */

@media (max-width: 800px) {

    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 650px) {

    header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
    }

    .product {
        flex-direction: column;
    }

    .product img {
        width: 100%;
        height: 250px;
    }

    .tools {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

```
<h1>Shanzay Boutique Admin</h1>

<a href="/" class="home">
    View Website
</a>
```

</header>

<div class="container">

<!-- DASHBOARD -->

<div class="dashboard">

```
<div class="stat">
    <h3>Total Products</h3>
    <div class="stat-number" id="totalProducts">0</div>
</div>

<div class="stat">
    <h3>Featured</h3>
    <div class="stat-number" id="featuredProducts">0</div>
</div>

<div class="stat">
    <h3>New Collection</h3>
    <div class="stat-number" id="newProducts">0</div>
</div>

<div class="stat">
    <h3>Categories</h3>
    <div class="stat-number" id="categoryCount">0</div>
</div>
```

</div>

<!-- ADD / EDIT PRODUCT -->

<div class="box">

```
<h2 id="title">
    Add New Product
</h2>

<input
    type="text"
    id="name"
    placeholder="Product Name"
>

<input
    type="number"
    id="price"
    placeholder="Regular Price"
>

<input
    type="number"
    id="salePrice"
    placeholder="Sale Price (optional)"
>

<select id="category">

    <option value="Lawn">Lawn</option>
    <option value="Unstitched">Unstitched</option>
    <option value="Stitched">Stitched</option>
    <option value="Party Wear">Party Wear</option>
    <option value="Casual">Casual</option>
    <option value="Formal">Formal</option>
    <option value="Other">Other</option>

</select>

<textarea
    id="description"
    placeholder="Product Description"
></textarea>

<label>
    Product Image
</label>

<input
    type="file"
    id="image"
    accept="image/*"
>

<div class="checks">

    <label>
        <input type="checkbox" id="featured">
        Featured
    </label>

    <label>
        <input type="checkbox" id="isNew">
        New Collection
    </label>

</div>

<button
    class="main-btn"
    id="saveButton"
    onclick="saveProduct()"
>
    Add Product
</button>

<button
    class="main-btn cancel"
    id="cancelButton"
    onclick="cancelEdit()"
>
    Cancel Edit
</button>

<div
    class="message"
    id="message"
></div>
```

</div>

<!-- PRODUCTS -->

<div class="box">

```
<h2>
    Products
</h2>

<div class="tools">

    <input
        type="text"
        id="search"
        placeholder="Search products..."
        oninput="filterProducts()"
    >

    <select
        id="filterCategory"
        onchange="filterProducts()"
    >

        <option value="all">
            All Categories
        </option>

        <option value="Lawn">
            Lawn
        </option>

        <option value="Unstitched">
            Unstitched
        </option>

        <option value="Stitched">
            Stitched
        </option>

        <option value="Party Wear">
            Party Wear
        </option>

        <option value="Casual">
            Casual
        </option>

        <option value="Formal">
            Formal
        </option>

        <option value="Other">
            Other
        </option>

    </select>

</div>

<div
    class="count"
    id="productCount"
>
    0 products
</div>

<div id="products">

    <div class="empty">
        Loading...
    </div>

</div>
```

</div>

</div>

<script>

let products = [];
let editingId = null;

/* LOAD PRODUCTS */

async function loadProducts() {

    try {

        const response =
            await fetch("/api/products");

        if (!response.ok) {
            throw new Error("Could not load products");
        }

        products =
            await response.json();

        updateDashboard();

        filterProducts();

    } catch (error) {

        console.error(error);

        document.getElementById("products").innerHTML =
            "<div class='empty'>Unable to load products.</div>";

    }

}

/* DASHBOARD */

function updateDashboard() {

    document.getElementById("totalProducts").textContent =
        products.length;

    document.getElementById("featuredProducts").textContent =
        products.filter(p => p.featured).length;

    document.getElementById("newProducts").textContent =
        products.filter(p => p.isNew).length;

    const categories =
        new Set(
            products.map(
                p => p.category || "Other"
            )
        );

    document.getElementById("categoryCount").textContent =
        categories.size;

}

/* FILTER */

function filterProducts() {

    const search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const category =
        document.getElementById("filterCategory")
        .value;

    const filtered =
        products.filter(product => {

            const name =
                String(product.name || "")
                .toLowerCase();

            const description =
                String(product.description || "")
                .toLowerCase();

            const productCategory =
                product.category || "Other";

            const matchesSearch =
                name.includes(search) ||
                description.includes(search);

            const matchesCategory =
                category === "all" ||
                productCategory === category;

            return matchesSearch &&
                   matchesCategory;

        });

    displayProducts(filtered);

}

/* DISPLAY PRODUCTS */

function displayProducts(list = products) {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    document.getElementById("productCount").textContent =
        list.length +
        (list.length === 1 ? " product" : " products");

    if (list.length === 0) {

        container.innerHTML =
            "<div class='empty'>No products found.</div>";

        return;
    }

    list.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";

        const image =
            product.image || "";

        let priceHTML =
            `<span class="price">Rs. ${escapeHTML(product.price)}</span>`;

        if (product.salePrice) {

            priceHTML =
                `<span class="price">Rs. ${escapeHTML(product.salePrice)}</span>
                 <span class="old">Rs. ${escapeHTML(product.price)}</span>`;

        }

        div.innerHTML = `

            ${
                image
                ? `<img
                    src="${escapeHTML(image)}"
                    alt="${escapeHTML(product.name)}"
                   >`
                : `<div style="
                    width:130px;
                    height:150px;
                    background:#eee;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    border-radius:8px;
                ">
                    No Image
                </div>`
            }

            <div class="info">

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                <div>
                    ${priceHTML}
                </div>

                <p>
                    <strong>Category:</strong>
                    ${escapeHTML(product.category || "Other")}
                </p>

                <p>
                    ${escapeHTML(product.description || "")}
                </p>

                ${
                    product.featured
                    ? "<span class='badge'>FEATURED</span>"
                    : ""
                }

                ${
                    product.isNew
                    ? "<span class='badge'>NEW</span>"
                    : ""
                }

                <div style="margin-top:12px;">

                    <button
                        class="edit"
                        onclick="editProduct(${product.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete"
                        onclick="deleteProduct(${product.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `;

        container.appendChild(div);

    });

}

/* ESCAPE HTML */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

/* SAVE PRODUCT */

async function saveProduct() {

    const name =
        document.getElementById("name")
        .value
        .trim();

    const price =
        document.getElementById("price")
        .value
        .trim();

    const salePrice =
        document.getElementById("salePrice")
        .value
        .trim();

    const category =
        document.getElementById("category")
        .value;

    const description =
        document.getElementById("description")
        .value
        .trim();

    const featured =
        document.getElementById("featured")
        .checked;

    const isNew =
        document.getElementById("isNew")
        .checked;

    const imageInput =
        document.getElementById("image");

    const message =
        document.getElementById("message");

    if (!name || !price) {

        alert(
            "Product name and price are required."
        );

        return;

    }

    const saveButton =
        document.getElementById("saveButton");

    saveButton.disabled = true;

    saveButton.textContent =
        "Saving...";

    try {

        let image = "";

        /* UPLOAD IMAGE */

        if (imageInput.files.length > 0) {

            const formData =
                new FormData();

            formData.append(
                "image",
                imageInput.files[0]
            );

            const uploadResponse =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );

            const uploadData =
                await uploadResponse.json();

            if (!uploadResponse.ok) {

                throw new Error(
                    uploadData.error ||
                    "Image upload failed."
                );

            }

            image =
                uploadData.image || "";

        }

        /* KEEP OLD IMAGE WHEN EDITING */

        if (
            editingId &&
            !image
        ) {

            const oldProduct =
                products.find(
                    p => p.id === editingId
                );

            if (oldProduct) {

                image =
                    oldProduct.image || "";

            }

        }

        const productData = {

            name: name,

            price: price,

            salePrice: salePrice,

            description: description,

            category: category,

            featured: featured,

            isNew: isNew,

            image: image

        };

        let response;

        /* UPDATE */

        if (editingId) {

            response =
                await fetch(
                    "/api/products/" +
                    editingId,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                productData
                            )

                    }
                );

        }

        /* ADD */

        else {

            response =
                await fetch(
                    "/api/products",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                productData
                            )

                    }
                );

        }

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Could not save product."
            );

        }

        message.textContent =
            editingId
            ? "Product updated successfully!"
            : "Product added successfully!";

        clearForm();

        await loadProducts();

    }

    catch (error) {

        console.error(error);

        alert(error.message);

    }

    finally {

        saveButton.disabled = false;

        saveButton.textContent =
            editingId
            ? "Update Product"
            : "Add Product";

    }

}

/* EDIT */

function editProduct(id) {

    const product =
        products.find(
            p => p.id === id
        );

    if (!product) {

        alert("Product not found.");

        return;

    }

    editingId = id;

    document.getElementById("title")
        .textContent =
        "Edit Product";

    document.getElementById("saveButton")
        .textContent =
        "Update Product";

    document.getElementById("cancelButton")
        .style.display =
        "block";

    document.getElementById("name")
        .value =
        product.name || "";

    document.getElementById("price")
        .value =
        product.price || "";

    document.getElementById("salePrice")
        .value =
        product.salePrice || "";

    document.getElementById("category")
        .value =
        product.category || "Other";

    document.getElementById("description")
        .value =
        product.description || "";

    document.getElementById("featured")
        .checked =
        Boolean(product.featured);

    document.getElementById("isNew")
        .checked =
        Boolean(product.isNew);

    document.getElementById("image")
        .value = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

/* CANCEL EDIT */

function cancelEdit() {

    clearForm();

}

/* CLEAR FORM */

function clearForm() {

    editingId = null;

    document.getElementById("name")
        .value = "";

    document.getElementById("price")
        .value = "";

    document.getElementById("salePrice")
        .value = "";

    document.getElementById("description")
        .value = "";

    document.getElementById("category")
        .value = "Lawn";

    document.getElementById("featured")
        .checked = false;

    document.getElementById("isNew")
        .checked = false;

    document.getElementById("image")
        .value = "";

    document.getElementById("title")
        .textContent =
        "Add New Product";

    document.getElementById("saveButton")
        .textContent =
        "Add Product";

    document.getElementById("cancelButton")
        .style.display =
        "none";

}

/* DELETE */

async function deleteProduct(id) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }

    try {

        const response =
            await fetch(
                "/api/products/" + id,
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error ||
                "Delete failed."
            );

        }

        await loadProducts();

    }

    catch (error) {

        console.error(error);

        alert(error.message);

    }

}

/* START */

loadProducts();

</script>

</body>
</html>
